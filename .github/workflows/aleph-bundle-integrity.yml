name: Aleph bundle integrity

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.loa-aleph.lock.json'
      - '.claude/aleph/**'
      - '.claude/commands/loa-aleph*.md'
      - '.claude/skills/loa-aleph/**'
      - 'tools/aleph-release-ingest.py'
      - '.github/workflows/aleph-bundle-integrity.yml'
      - '.github/workflows/aleph-release-sync.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.loa-aleph.lock.json'
      - '.claude/aleph/**'
      - '.claude/commands/loa-aleph*.md'
      - '.claude/skills/loa-aleph/**'
      - 'tools/aleph-release-ingest.py'
      - '.github/workflows/aleph-bundle-integrity.yml'
      - '.github/workflows/aleph-release-sync.yml'

permissions:
  contents: read

jobs:
  # bug 20260922-13a3d1: Aleph is opt-in. Every job below runs only when the
  # repository's .loa.config.yaml says `aleph.enabled: true`; a missing key or
  # any other value reads as disabled, and the workflow no-ops.
  gate:
    name: Aleph opt-in gate (aleph.enabled)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
    steps:
      # The gate is decided by the BASE branch's config on pull requests, never
      # by the PR head: a PR that touches Aleph paths cannot flip its own gate
      # off (sprint-bug-239 audit dissent). On push events this is the pushed
      # commit itself.
      - name: Checkout the base ref's configuration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Read aleph.enabled
        id: read
        run: |
          set -euo pipefail
          # Same POSIX-awk reader as .claude/scripts/lib/aleph-opt-in.sh — no yq,
          # so a runner's parser inventory can never decide the gate.
          enabled=false
          if [ -f .loa.config.yaml ]; then
            v=$(awk '
              /^[A-Za-z_]/ { in_aleph = ($0 ~ /^aleph:[[:space:]]*(#.*)?$/) }
              in_aleph && /^[[:space:]]+enabled:[[:space:]]*true([[:space:]]*(#.*)?)?$/ { print "true"; exit }
            ' .loa.config.yaml)
            [ "$v" = "true" ] && enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "Aleph opt-in (.loa.config.yaml aleph.enabled): $enabled" >> "$GITHUB_STEP_SUMMARY"
  verify:
    name: Verify install and status (Node ${{ matrix.node }})
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Authenticate the pin and installed tree with Loa-owned code
        run: |
          set -euo pipefail
          python3 tools/aleph-release-ingest.py verify-installed \
            --root . \
            --pin .loa-aleph.lock.json

      - name: Run the authenticated upstream receipt verifier
        run: |
          set -euo pipefail
          installer='.claude/aleph/runtime/bundle/runtime-js/adapters/loa/src/installer.js'
          test -f "$installer"
          env -u NODE_OPTIONS -u NODE_PATH \
            node "$installer" verify-install --target . --json

      - name: Smoke-test read-only status (start may remain capability-blocked)
        run: |
          set -euo pipefail
          launcher='.claude/aleph/bin/loa-aleph.mjs'
          test -f "$launcher"
          env -u NODE_OPTIONS -u NODE_PATH node "$launcher" status

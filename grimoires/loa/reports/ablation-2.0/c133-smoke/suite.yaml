# =============================================================================
# evals/suites/ablation-2.0.yaml — cycle-130 Loa 2.0 component ablation suite
#
# SDD §3.3 (structure reproduced), extended by Sprint 258 Task 1.6: the
# tasks block with the smoke root, phase_defaults, phase_sets, cost_hint, each
# arm's phase-set override and took-effect rule ids, and the full pre-registered
# rules block (D-A5; mirrored in NOTES before the first run, DEC-0383).
#
# Readers: execute-agent.sh / lib/sandbox-mount.sh (arms[].toggles via
# resolve_arm_toggles), pipeline-run.sh (phase_defaults, phase_sets,
# arms[].phases, arms[].effort), took-effect.sh (arms[].took_effect),
# run-ablation.sh (trials, caps, priority, cut_ladder, arms[].task_types),
# ablation-report.py (rules), validate-suite.sh (arm ids for the leakage check,
# task_types against the known types).
#
# task_types: `all` | `build` (= feature-build, bug-fix, refactor) |
#   `review-catch` | a single build type. An arm is never scheduled, and a row
#   never reported, on a type outside its declaration (DEC-0400, DEC-0406).
# took_effect: rule ids took-effect.sh evaluates per trial (DEC-0418); a miss is
#   infrastructure_error and pauses the arm. `applicability_refused` is the
#   smoke's evidence line that the planner refused the arm on a review-catch task.
# toggles (the vocabulary apply_arm_toggles and pipeline-run.sh accept; every value is
#   `false` except where named): companion_voice, karpathy_block, rule_files,
#   audit_delta_instruction, loa_mount, gates, flatline, sprint_plan, context_resets,
#   effort: low|medium|high|xhigh|max, and from cycle-131 (FR-5, DEC-0619)
#   bare_model: fable (BARE on Fable 5.1), dissent: false (the review gate's
#   adversarial dissent off in the sandbox config; the audit gate unchanged),
#   oracle_open: true (eval-only: the closed-mount overlay skipped, mount_overlay=none), and from
#   cycle-132 (FR-3, SDD D-3.1) bare_sessions: matched (with loa_mount: false: a cell is k
#   independent BARE sessions, k = the task's review_catch.bare_sessions_matched; the
#   _fable_matched arm reads review_catch.bare_sessions_matched_fable when present).
#   The vocabulary is lib/sandbox-mount.sh print_toggle_vocabulary (bd-gdl5s).
#   Every mounted review-catch arm runs the closed mount (lib/sandbox-mount.sh
#   overlay_answer_paths, head mode unless the task sets review_catch.overlay_mode: base)
#   and every mounted arm the eval config variant (config_variant=eval).
# eval_only: true|false (cycle-131 FR-5; default false): an evaluation-only arm. pipeline-run.sh
#   refuses it (exit 2) unless it is given --batch-context <id> (cycle-132 bd-st02i; the argv flag
#   run-ablation.sh passes to every trial it launches replaced the LOA_ABLATION_BATCH_CONTEXT
#   variable); validate-suite.sh requires it on an arm whose toggles set oracle_open: true.
# dissent_present (cycle-132 PREREGISTRATION §12 addendum 2): on a1_full, a1_review_only and a1_full_openmount — every
#   gate that ran had its dissent (envelope, ≥ 1 voice, not budget_exceeded or refused); a dissent skipped on budget is
#   a took-effect FAIL (infrastructure_error, the arm pauses), never a silently single-voice row.
# mount_cheval_ok (cycle-132 bd-56nn6): on every mounted arm whose gates run a dissent;
#   pipeline-run.sh probes the sandbox's loa_cheval import before the first phase and refuses a
#   broken mount on such an arm (KF-050).
# refusal_policy (cycle-133 SDD C-8, PRD FR-8, bd-r9abp): exclude | keep | rerun-once per arm; absent = exclude
#   (no arm sets it: every arm runs exclude, cycle-132's behaviour). What a row whose session fell back to another
#   model on a safeguard refusal (KF-051) counts as: exclude — the row is invalid and leaves the denominator; keep —
#   the row is valid, flagged and counted; rerun-once — the trial is relaunched once at the same plan index (both
#   attempts kept and charged) and the second attempt's row is the cell when it has no fallback, else the cell is
#   invalid. run-ablation.sh refuses another value, and any policy but exclude on a bare_sessions: matched arm, at
#   pre-flight (exit 2) and records the policy per arm in MANIFEST.json refusal_policy before execution; ablation-row.sh
#   (row writer 1.6) writes refusal_policy_applied, attempt, refusal_attempts, refusal_outcome, refusal_denominator
#   and refusal_flagged, and --refusal-rate flags an arm whose refusal_rate is above 0.2. evals/harness/README.md
#   § Refusal policy.
# =============================================================================
name: ablation-2.0
version: 1
source_commit: "ba11b860" # the pin: the Sprint 259 completion tree (rc.5 + the #1267 mount fix + the harness; .claude/ identical to the Sprint 258 completion tree, DEC-0529; the per-batch .claude/ delta vs 4d69c3c4 is in MANIFEST.json, DEC-0392)
agy_opt_in: false
tasks:
  root: grimoires/loa/evals/ablation-2.0/tasks
  manifest: grimoires/loa/evals/ablation-2.0/MANIFEST.sha256
  smoke_root: grimoires/loa/evals/ablation-2.0/smoke
suite_version: 2 # suite v2 (DEC-0559, DEC-0566): twelve harder build tasks with v2 ids; the four review-catch tasks unchanged in content
trials: {build: 3, review-catch: 3} # D-A4: review-catch trials 3, not 5, under the gate pipeline
cut_ladder: ["A5, A6, A7 not run", "A2 and A3 build trials 3 -> 2", "A3 review-catch trials 3 -> 2"] # DEC-0397; A0, A1, A4 keep 3
# Per-run caps (DEC-0559, DEC-0567): from Sprint 261 the cap is per task kind,
# run_usd_by_type {build: 15, review-catch: 20}; run-ablation.sh passes the kind's cap to
# pipeline-run.sh --max-run-usd, charges a cap failure or a costless failed trial that
# kind's cap, and reserves in-flight trials at the largest cap among the plan's kinds.
# run_usd stays the single-cap fallback (suite v1 batches, a kind without an entry) and
# --run-cap overrides both kinds. reserve_usd is kept for spend.sh; DEC-0559 released the
# reserve (a batch's --max-usd = 1,500 - spend so far - concurrency x the largest cap).
caps: {cycle_usd: 1500, run_usd: 12, reserve_usd: 250, run_usd_by_type: {build: 15, review-catch: 20}}
priority: [a0_bare, a1_full, a2_no_sprint_plan, a3_one_voice, a4_no_gates, a7_effort_medium, a5_no_flatline, a6_one_window]
cost_hint: {build: 7, review-catch: 8} # USD per run before any actual exists (run-arms/run-ablation est_next fallback)
# Session defaults per phase (SDD D-4.3). A6's continued session carries the
# caps of the phase it is in; A0's BARE caps are PLAN + IMPLEMENT + 2 x FIX.
phase_defaults:
  models:
    PLAN: global.anthropic.claude-opus-5-5
    IMPLEMENT: global.anthropic.claude-opus-5-5
    FIX: global.anthropic.claude-opus-5-5
    BARE: global.anthropic.claude-opus-5-5
    REVIEW: global.anthropic.claude-fable-5-1
    AUDIT: global.anthropic.claude-fable-5-1
  # REVIEW/AUDIT 60 turns / 30 min: the Sprint 258 smoke saw a review-catch AUDIT hit 40 turns after writing its
  # verdict (DEC-0490); BARE stays the implementer-side sum (PLAN + IMPLEMENT + 2 x FIX)
  max_turns: {PLAN: 30, IMPLEMENT: 60, REVIEW: 60, FIX: 40, AUDIT: 60, BARE: 170}
  timeout_min: {PLAN: 15, IMPLEMENT: 25, REVIEW: 30, FIX: 15, AUDIT: 30, BARE: 70}
  tools: "Bash,Read,Grep,Glob,Write,Edit,Task,WebFetch" # identical for every arm, A0 included
phase_sets: # D-4.1: A1's phases per task type; FIX runs only after a CHANGES_REQUIRED gate
  review-catch: [REVIEW, AUDIT]
  build: [PLAN, IMPLEMENT, REVIEW, FIX, AUDIT, FIX]
arms:
  - {id: a0_bare, label: A0, task_types: [all], toggles: {loa_mount: false}, phases: [BARE], effort: high, took_effect: [no_dot_claude, no_system_prompt, no_audit_rows, integrity_clean]}
  - {id: a1_full, label: A1, task_types: [all], toggles: {}, took_effect: [all_phases_present, oracle_closed, integrity_clean, mount_cheval_ok, dissent_present], mount_mode: home-scope} # oracle_closed: cycle-131 FR-1 (DEC-0615); review-catch runs only, a build run passes it vacuously; dissent_present: cycle-132 addendum 2
  - {id: a2_no_sprint_plan, label: A2, task_types: [build], toggles: {sprint_plan: false}, phases: [IMPLEMENT, REVIEW, FIX, AUDIT, FIX], took_effect: [no_plan_phase, applicability_refused, integrity_clean, mount_cheval_ok]}
  - {id: a3_one_voice, label: A3, task_types: [all], toggles: {companion_voice: false}, took_effect: [one_voice_planned, integrity_clean, mount_cheval_ok]}
  - {id: a4_no_gates, label: A4, task_types: [build], toggles: {gates: false}, phases: [PLAN, IMPLEMENT], took_effect: [no_gate_phases, enforce_env_false, applicability_refused, integrity_clean]} # build only: on a review-catch task the gates are the task (DEC-0400)
  - {id: a5_no_flatline, label: A5, task_types: [build], toggles: {flatline: false}, took_effect: [no_flatline_rows, applicability_refused, integrity_clean, mount_cheval_ok]}
  - {id: a6_one_window, label: A6, task_types: [build], toggles: {context_resets: false}, took_effect: [implementer_single_session, gates_separate_sessions, applicability_refused, integrity_clean, mount_cheval_ok]}
  - {id: a7_effort_medium, label: A7, task_types: [all], toggles: {effort: medium}, took_effect: [effort_flag_medium, skill_effort_stripped, integrity_clean, mount_cheval_ok]}
  # cycle-131 FR-5 (DEC-0619, SDD §3.2 "Entity: suite arm"): review-catch only. a0_bare_fable is A0 on the
  # review model; a1_review_only drops the AUDIT gate; a1_no_dissent turns the review gate's dissent off;
  # a1_full_openmount is the cycle-130 open mount, eval_only (pipeline-run.sh refuses it outside a
  # run-ablation.sh batch or smoke: LOA_ABLATION_BATCH_CONTEXT=1) and never a decision arm
  - {id: a0_bare_fable, label: A0F, task_types: [review-catch], toggles: {loa_mount: false, bare_model: fable}, phases: [BARE], effort: high, took_effect: [no_dot_claude, no_system_prompt, no_audit_rows, bare_model_fable, integrity_clean]}
  - {id: a1_review_only, label: A1R, task_types: [review-catch], toggles: {}, phases: [REVIEW], took_effect: [review_only_phases, oracle_closed, integrity_clean, mount_cheval_ok, dissent_present]}
  - {id: a1_no_dissent, label: A1N, task_types: [review-catch], toggles: {dissent: false}, took_effect: [all_phases_present, no_review_dissent_envelope, oracle_closed, integrity_clean, mount_cheval_ok]}
  - {id: a1_full_openmount, label: A1O, task_types: [review-catch], toggles: {oracle_open: true}, eval_only: true, took_effect: [all_phases_present, oracle_open_recorded, integrity_clean, mount_cheval_ok, dissent_present]}
  # cycle-132 FR-3 (SDD D-3.1, D-3.2, D-7.3; PRD D13): the compute-matched bare arms, review-catch only. A cell is
  # k independent a0_bare-shaped BARE sessions (run-ablation.sh session units under <cell>/sessions/s<i>/), union-
  # graded (ablation-grade.sh --union); bare_sessions_matched checks k and every valid session's bare rules
  - {id: a0_bare_matched, label: A0M, task_types: [review-catch], toggles: {loa_mount: false, bare_sessions: matched}, phases: [BARE], effort: high, took_effect: [no_dot_claude, no_system_prompt, no_audit_rows, integrity_clean, bare_sessions_matched]}
  - {id: a0_bare_fable_matched, label: A0FM, task_types: [review-catch], toggles: {loa_mount: false, bare_model: fable, bare_sessions: matched}, phases: [BARE], effort: high, took_effect: [no_dot_claude, no_system_prompt, no_audit_rows, bare_model_fable, integrity_clean, bare_sessions_matched]}
  - {id: a8_no_ceremonies, label: A8, absent: true, evidence: "no /meeting command, skill or sosyete config key at 4d69c3c4 (grep -rli sosyete .claude/ docs/; ls .claude/commands .claude/skills)"}
# cycle-133 FR-9 (SDD C-9; D-2.5 DEC-0854): the network of each arm's sandbox. blocked = the batch's egress block
# (lib/egress-proxy.sh: internal network, DNS sinkholed, the tinyproxy sidecar with the egress_hosts[] allowlist
# of .claude/defaults/model-config.yaml); bridge = the docker bridge, allowed only as a factor the batch records.
# Resolution: arms[].egress, else egress.arms.<id>, else egress.default, else blocked. Recorded in MANIFEST.json
# `egress` and each run's meta/egress.jsonl. The open-mount control keeps blocked.
egress:
  default: blocked
  arms: {a0_bare: blocked, a1_full: blocked, a2_no_sprint_plan: blocked, a3_one_voice: blocked, a4_no_gates: blocked, a5_no_flatline: blocked, a6_one_window: blocked, a7_effort_medium: blocked, a0_bare_fable: blocked, a1_review_only: blocked, a1_no_dissent: blocked, a1_full_openmount: blocked, a0_bare_matched: blocked, a0_bare_fable_matched: blocked, a8_no_ceremonies: blocked}
# mount_mode (cycle-133 C-10, PRD FR-10; additive, the default unchanged): how a mounted review-catch arm's sandbox holds
# the framework. pinned-root = the cycle-132 mount (the pinned framework at the workspace root; PREREGISTRATION §12
# addendum 9). home-scope = the pinned framework under the session's HOME (user scope), the PR's changed framework paths
# at the root as data, the executable and prompt surface only under pr/head/; took-effect oracle_closed then adds
# clauses (e)-(g). Resolution: arms[].mount_mode, else mount_mode.default, else pinned-root. pipeline-run.sh refuses
# home-scope until its launch path lands (after the Sprint 274 scope spike, D-3.6).
mount_mode:
  default: pinned-root
rules: # D-A5: pre-registered, mirrored in NOTES
  threshold_points: 0.03
  cost_lower_pct: 15
  bootstrap: {resamples: 10000, level: 0.90, paired: true, units: {hidden_test_pass_rate: tasks, defect_catch_rate: defects}, also_report: {defect_catch_rate: tasks}} # DEC-0399
  primaries_by_arm: {build_only: [hidden_test_pass_rate], all_types: [hidden_test_pass_rate, defect_catch_rate]} # DEC-0400
  cap_failure: counts_as_failed # 0 on each applicable primary (DEC-0393)
  exclusion: {statuses: [degraded, contaminated, interrupted], mode: pairwise, inconclusive_above_share: 0.25}
  sensitivity_figure: cap_failures_excluded # printed, never decides
  multiple_comparisons: none # expected false positives at 0.90 over 6 components printed
  drift_guard: {cli_version: fixed_per_batch, model_ids: fixed_per_batch} # DEC-0407
  order: trial_major_seeded_shuffle_within_block
  took_effect_per_trial: true # a miss → infrastructure_error, arm paused until --clear-arm (DEC-0418)
  predicates: # DEC-0416, DEC-0393, DEC-0530; d = arm − A1 point estimate, [lo, hi] its 90 % interval, c/w = cost/wall-clock Δ %; evaluated in this order
    inconclusive_by_degradation: "the arm's excluded share > 0.25 (whatever its interval; DEC-0393)"
    investigate: "else any applicable primary has lo > 0"
    keep: "else any applicable primary has d < -0.03 and hi < 0"
    inconclusive: "else any applicable primary has d < -0.03, or no valid pair"
    remove: "else every applicable primary has d >= -0.03 and (c <= -15 or w <= -15)"
    simplify: "else (every applicable primary within -0.03, cost similar)"
  review_catch: {defect_counts_once_across_gates: true, false_positive_dedupe: cited_region, verdict_accurate_iff: "CHANGES_REQUIRED when the key holds a high or critical defect, APPROVED when none"} # DEC-0420
  inconclusive_extension_trials: 2
  h1: "a1_full beats a0_bare on at least one primary with the interval excluding zero, else halt before promotion"
  a4_sensitivity: "a4_no_gates worse than a1_full on hidden_test_pass_rate with the interval excluding zero, else harden tasks before acting on other arms"
  decision_states: [investigate, keep, inconclusive, remove, simplify, not_run_cut, inconclusive_by_power]
  mde_cut: 0.10 # sprint Task 3.4: an arm whose MDE at affordable trials exceeds this is pre-declared inconclusive_by_power and not run

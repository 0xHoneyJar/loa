  - id: "DEC-0170"
    created_at: "2026-10-13T22:28:52Z"
    updated_at: "2026-10-13T22:28:52Z"
    phase: "sprint-planning"
    category: "security"
    summary: "Bridgebuilder honours keyless or insecure providers only from trusted config (base branch or repo settings), never the PR head (D36)"
    decision: "config.ts reads hounfour.providers from the base branch's .loa.config.yaml (the merge target) or from repository settings when running on a pull request; a keyless or allow_insecure_endpoint provider that exists only in the head checkout is refused with head-only provider declaration refused: <name> and logged; the health probe follows the same source; a vitest covers the head-only case; the config source precedence is documented in the Bridgebuilder reference; bridgebuilder.exit_on_degraded (default 3, 0 restores today) is the exit-code rollback key"
    rationale: "a pull request could otherwise declare an attacker host as a keyless provider and have CI send it the diff; the probe would be an SSRF primitive (sprint Flatline SKP-008)"
    alternatives_considered:
      - option: "read the merged config from the checkout under review"
        rejected_because: "the checkout under review is attacker-controlled on a pull request"
    consequences: null
    proposed_by: "agent"

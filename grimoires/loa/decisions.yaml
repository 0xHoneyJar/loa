    decision: "The fix for review HIGH-1 is a normalisation step after the heredoc scrub and before the carrier scrubs: a backtick pair outside single quotes becomes the dollar-paren form the rules anchor on. The normaliser walks the command line by line, uses the FR-6 header parser to find each heredoc's delimiter and quoting, alternates every backtick in an unquoted body, leaves a quoted body untouched, tracks shell quotes elsewhere, and redoes the shell text with quoting ignored when the quotes do not balance (an apostrophe in prose), when a header is unreadable or when a header holds several heredocs. Kept segments of a quoted body have their literal backticks stripped first."
    rationale: "a pre-existing hole (identical on main) that every rule shared; one normalisation fixes all of them without touching a pattern id, and heredoc awareness keeps quoted-delimiter prose literal (B79, B81, B84, B86, B91 allow; D143-D148 block)"

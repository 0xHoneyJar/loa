  - id: "DEC-0169"
    created_at: "2026-10-13T22:28:51Z"
    updated_at: "2026-10-13T22:28:51Z"
    phase: "sprint-planning"
    category: "planning"
    summary: "Kernel-row deletions by evidence class: arm verdict for review prose, pointers for mechanism rows, proposed DEC rows for behavioural rows (D35)"
    decision: "Task 2.8 classifies every candidate row: review-affecting prose (the Karpathy block, the audit delta instruction) is removed only with a no-recall-loss verdict from its arm and the lead's missed-label reading; mechanism-describing rows shrink to pointers without evidence because the mechanism holds; behavioural prose-only rows (TaskCreate, /bug eligibility, beads creation) move to a protocol with a kernel pointer and each move is a proposed DEC row the operator confirms, with the register's block, ask and telemetry counts as the instrument going forward; the two rule files are path-scoped on the crosswalk, not on the arm"
    rationale: "the review-recall arms measure reviewer behaviour, not implementer or operator behaviour, and the four arms are coarser than a row (sprint Flatline SKP-002, opus IMP-011)"
    alternatives_considered:
      - option: "one arm licenses every deletion"
        rejected_because: "an arm measuring review recall cannot license removing an implementer rule"
    consequences: null

    category: "architecture"
    summary: "Replay audit rows are marked at the source (LOA_AUDIT_REPLAY=1 -> replay: true); the cwd heuristic stays as the fallback for older rows (A10)"
    decision: "block-destructive-bash.sh, implement-gate.sh and the mutation loggers add replay: true to their audit rows when LOA_AUDIT_REPLAY=1 is set; tests/run-bats.sh, run-corpus.sh and execute-agent.sh export it; guard-yield.sh excludes replay: true rows first and applies the cwd-prefix heuristic only to rows that predate the flag"
    rationale: "a flag written by the producer beats a path heuristic guessed by the consumer (SDD review opus IMP-008; KF-033 class)"
    alternatives_considered:

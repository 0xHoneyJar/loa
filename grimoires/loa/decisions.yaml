    decision: "run-arms.sh pins --model global.anthropic.claude-opus-5-5 for every batch; implementer B's proof trial on claude-fable-5-1 was refused by a safeguard (category cyber) and the CLI fell back to Opus 5.5 for the rest of the session with no flag to disable the fallback, so a Fable run mixes models unpredictably and reads inconclusive under the pre-registered skew rule; the model-transfer assumption (arms measured on Opus 5.5, the production gates run on Fable 5.1) is recorded in the arms report header and next to every kernel-row change the arms clear"

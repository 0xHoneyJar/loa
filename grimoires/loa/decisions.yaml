    decision: "batch 1 (pr-01..pr-08, 144 trials) starts after the Sprint 1 commit; the lead reads its MANIFEST cost and mean trial time, projects batch 2 (record fixtures, diffs 10-60 times larger) from them, and starts batch 2 at the pre-registered 3 trials only if the projection stays under 1,500 USD list (the sprint-248 dissent spend the operator absorbed); otherwise batch 2 runs one trial per fixture as a sizing pass, the record arms read inconclusive by pre-registration, and the Sprint 2 diet takes the D-2.4 fallback for them"
    rationale: "an unattended cycle must not commit several thousand metered dollars on a projection nobody has seen (B measured 3.2-3.5 USD and 5-9 min per pr-01 trial; batch 2 is estimated at 18-30 h)"

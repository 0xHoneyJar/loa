    phase: "sprint-planning"
    category: "planning"
    summary: "Arm batches start as early as their inputs exist; Task 2.8 runs last; the fallback deletes nothing; amends A1 (D37)"
    decision: "run-arms.sh accepts --fixtures; Tasks 1.4 and 1.6 are sequenced first in Sprint 1 so batch 1 (pr-01..pr-08, pinned at 864069f2) starts mid-Sprint 1 and batch 2 (pr-09..pr-16) starts when Task 1.5 lands; the lead checks STATUS.json when Sprint 2 opens and again before Task 2.8, the last Sprint 2 task; on the fallback path no kernel row is deleted and LOA_LIMIT stays at min(current, measured + 256 B), unchanged when nothing moved"
    rationale: "a run started at the very end of Sprint 1 cannot finish before Sprint 2 opens in an unattended run, so the fallback would be near-certain rather than a risk (sprint Flatline SKP-001, opus IMP-020)"
    alternatives_considered:
      - option: "start at the end of Sprint 1"
        rejected_because: "guarantees the fallback"

  - id: "DEC-0156"
    created_at: "2026-10-13T21:56:58Z"
    updated_at: "2026-10-13T21:56:58Z"
    phase: "discovery"
    category: "security"
    summary: "FR-6 fails closed: an unlisted heredoc consumer scans in full; a body written to a file that the same line executes is interpreter-consumed (D25)"
    decision: "a heredoc whose consumer is on neither list is scanned exactly as today; a heredoc redirected to a path that the same command line executes, sources, or marks executable (bash x.sh, ./x, source x, chmod +x x, exec) is interpreter-consumed; the non-executing list is an exact-form allowlist (cat/tee/printf with a file redirect, gh pr or issue comment -F -, git commit -F -, br create or update reading stdin, jq and yq without -i) with argument-level checks; line start means after leading whitespace and after ; && || |; scratch-path blocks are out of FR-6's scope and the KPI measures the likely-FP share after rc.5"
    rationale: "the Flatline skeptics (SKP-001, SKP-004) named the write-then-execute form and the unlisted-consumer gap; the brief's relaxation must not become a bypass"
    alternatives_considered:
      - option: "two open lists with a permissive default"
        rejected_because: "an unlisted consumer would skip the scan; the two-step form on one line would bypass the fence"
    consequences: null
    proposed_by: "agent"

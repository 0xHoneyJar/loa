    category: "security"
    summary: "Harness-affecting changes land dark for this repository during the run; the deny flip and the classifier default wait for the cycle-end validation (D34)"
    decision: "implement-gate.sh, block-destructive-bash.sh, run-checkpoint.sh derive --write and profile-lib.sh are the hooks and readers the executing run depends on: after each apply the lead runs the fence corpus and the hook bats before any further tool call relies on them and records the result; this repository keeps implement_gate.mode: ask until the derived cache has been validated against the live run at the E2E step, then flips to deny in the cycle's last commit; destructive_command_guard.heredoc_classifier ships default true but the corpus and a smoke run gate each apply; a documented recovery step (git show HEAD:path > path for the hook, knob off) is in the Sprint 2 report"
    rationale: "the Flatline skeptics (sprint SKP-005, opus IMP-003) named the self-hosting failure: a defect in a live hook lands on the lead's own next invocation"
    alternatives_considered:
      - option: "apply and rely immediately"
        rejected_because: "one bad hook apply stalls the unattended run with no operator present"

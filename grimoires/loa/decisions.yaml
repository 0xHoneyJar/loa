# grimoires/loa/decisions.yaml: the decision ledger (schema: grimoires/loa/sdd.md §3.1,
# docs/architecture/decision-lineage.md). Tracked team state, like known-failures.md.
#
# Append-only. Rows are written only by .claude/scripts/lib/dec-write-lib.sh, which takes a lock,
# verifies every candidate (no id dropped, no content edit, transitions appended, the
# validate-artifact.sh --type decisions check) and renames it into place. Do not hand-edit rows:
# the validator rejects content edits against the base, and a rejected row is superseded, not rewritten.
#
# Lifecycle: open -> proposed (decide) -> decided (operator only, through /decisions confirm)
# -> superseded (operator only); open|proposed -> rejected (with rationale and follow-up).
# Skills write open or proposed rows; decided_by stays null until /decisions confirm sets it.
# A linked worktree writes grimoires/loa/a2a/sprint-<N>/decisions-pending.yaml instead and the
# lead imports it here (dec-write-lib.sh import), so ids are allocated in one place.
#
# The bar: every decision an agent takes on the operator's behalf unattended gets a row; an
# interactive decision gets one only when it is hard to reverse, surprising without context and
# a real trade-off (all three).
